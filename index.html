<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- MICROAPP_DARK_MODE.md: apply the gateway's saved theme before first paint (no white flash). -->
    <script>
      try {
        var c = localStorage.getItem("rizurf-theme");
        if (c) {
          var d = c === "dark" || (c === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute("data-theme", d ? "dark" : "light");
        }
      } catch (e) {}
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rizurf Employees — HR Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Rizurf API Gateway button (SS-28, MICROAPP_GATEWAY_BUTTON.md): served by the gateway — don't copy or restyle it. -->
    <script src="https://web-omega-two-47.vercel.app/widget/gateway-button.js" defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
